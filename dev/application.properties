# Development only (dev/README.md), on top of the application's own properties: dev/backend.sh loads it. Never in the jar.

# Mailpit keeps every email (http://localhost:8025); it speaks plain SMTP, so STARTTLS can't be required here.
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.starttls.required=false

# The emails' links open the Vite development server (CLAUDE.md, frontend point 1).
aemotional.base-url=http://localhost:5173

# The OpenAPI spec and Swagger UI (http://localhost:8080/swagger-ui.html).
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
