spring.application.name=aemotional-line

# MariaDB. Credentials come from the environment, never from the repository.
spring.datasource.url=${AEMOTIONAL_DB_URL:jdbc:mariadb://localhost:3306/aemotional_line}
spring.datasource.username=${AEMOTIONAL_DB_USER:aemotional}
spring.datasource.password=${AEMOTIONAL_DB_PASSWORD:}
# Write operations see the latest committed data after taking their locks; read-only operations ask for REPEATABLE READ
# themselves (@ReadOnlyTransaction), to see one consistent state across their queries (CLAUDE.md, 2026-11-03).
spring.datasource.hikari.transaction-isolation=TRANSACTION_READ_COMMITTED

# The public address of the application, used in the links sent by email.
aemotional.base-url=${AEMOTIONAL_BASE_URL:http://localhost:8080}
# Outgoing mail (SMTP); without spring.mail.host no email can be sent and sending fails loudly.
spring.mail.host=${AEMOTIONAL_MAIL_HOST:}
spring.mail.port=${AEMOTIONAL_MAIL_PORT:587}
spring.mail.username=${AEMOTIONAL_MAIL_USER:}
spring.mail.password=${AEMOTIONAL_MAIL_PASSWORD:}
aemotional.mail.from=${AEMOTIONAL_MAIL_FROM:no-reply@aemotional-line.local}
# The emails carry one-time links: the connection to the mail server must be encrypted (STARTTLS, port 587). For a server
# with implicit TLS (port 465) see docs/deployment.md (ssl.enable=true, the two starttls properties false).
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
# Retention period after a couple's end (ISO-8601, e.g. P365D): the data of couples ended longer ago are deleted every
# night. Empty = disabled, until the rule is decided with the privacy advisor.
aemotional.retention.after-end=${AEMOTIONAL_RETENTION_AFTER_END:}
# Login sessions in MariaDB (tables created by Flyway, V5), ended after 30 minutes without requests.
spring.session.jdbc.initialize-schema=never
server.servlet.session.timeout=30m
# The session cookie (S5): HTTPS only, never sent with another site's requests, unreadable by scripts; the __Host- prefix
# makes browsers refuse it unless it is Secure, for the whole host and with no Domain.
server.servlet.session.cookie.name=__Host-SESSION
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.path=/
# TLS ends at the reverse proxy: X-Forwarded-For and X-Forwarded-Proto are trusted only from it (Tomcat's internal
# proxies, by default loopback and private addresses; see docs/deployment.md).
server.forward-headers-strategy=native
# This logger's warnings quote fragments of malformed request bodies (passwords, message texts): they are client errors,
# already answered with a 400, so it logs errors only (no personal content in the logs, security point 5c).
logging.level.org.springframework.web.servlet.mvc.support.DefaultHandlerExceptionResolver=error
# Spring's "no mapping for GET /..." warnings would log paths typed by clients.
logging.level.org.springframework.web.servlet.PageNotFound=error
# JSON (REST points 2 and 4): an unknown field in a request is refused, so a misspelled one is caught at once.
spring.jackson.deserialization.fail-on-unknown-properties=true
# The OpenAPI spec and Swagger UI (REST point 7): development only, AEMOTIONAL_API_DOCS=true turns them on. The errors are
# described by ApiDocsConfiguration, not guessed from the exception handlers.
springdoc.api-docs.enabled=${AEMOTIONAL_API_DOCS:false}
springdoc.swagger-ui.enabled=${AEMOTIONAL_API_DOCS:false}
springdoc.override-with-generic-response=false
# Accounts are checked by the application's LoginService: no in-memory user with a generated password.
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
