spring.application.name=aemotional-line

# MariaDB. Credentials come from the environment, never from the repository.
spring.datasource.url=${AEMOTIONAL_DB_URL:jdbc:mariadb://localhost:3306/aemotional_line}
spring.datasource.username=${AEMOTIONAL_DB_USER:aemotional}
spring.datasource.password=${AEMOTIONAL_DB_PASSWORD:}
# Write operations see the latest committed data after taking their locks; read-only operations ask for REPEATABLE READ
# themselves (@ReadOnlyTransaction), to see one consistent state across their queries (CLAUDE.md, 2026-11-03).
spring.datasource.hikari.transaction-isolation=TRANSACTION_READ_COMMITTED

# The public address of the application, used in the links sent by email.
aemotional.base-url=${AEMOTIONAL_BASE_URL:http://localhost:8080}
# Outgoing mail (SMTP); without spring.mail.host no email can be sent and sending fails loudly.
spring.mail.host=${AEMOTIONAL_MAIL_HOST:}
spring.mail.port=${AEMOTIONAL_MAIL_PORT:587}
spring.mail.username=${AEMOTIONAL_MAIL_USER:}
spring.mail.password=${AEMOTIONAL_MAIL_PASSWORD:}
aemotional.mail.from=${AEMOTIONAL_MAIL_FROM:no-reply@aemotional-line.local}
# Retention period after a couple's end (ISO-8601, e.g. P365D): the data of couples ended longer ago are deleted every
# night. Empty = disabled, until the rule is decided with the privacy advisor.
aemotional.retention.after-end=${AEMOTIONAL_RETENTION_AFTER_END:}
